anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c9d4ff">rings per</text><text x="824" y="452" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c9d4ff">object smashed</text><line x1="752" y1="490" x2="896" y2="490" stroke="#8798d8" stroke-opacity="0.3"/><text x="824" y="530" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-style="italic" fill="#8f9fe0">crates, cars, barriers</text><circle cx="824.0" cy="580" r="13" fill="none" stroke="#ffd23f" stroke-width="4.2"/><circle cx="824.0" cy="580" r="13" fill="none" stroke="#fff6b0" stroke-width="1.5" stroke-dasharray="15.6 65.0" transform="rotate(-120 824.0 580)"/><rect x="946" y="160" width="204" height="470" rx="18" fill="#0d1a5c" fill-opacity="0.75" stroke="#4fd8ff" stroke-opacity="0.35" stroke-width="2"/><path d="M1076.0,240 A28,28 0 1,1 1048.0,212" fill="none" stroke="#bff6ff" stroke-width="6" stroke-linecap="round"/><polygon points="1046.0,200 1062.0,212 1046.0,224" fill="#bff6ff"/><text x="1048" y="320" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Impact, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-style="italic" fill="#ffffff">AUTO TRAILS</text><text x="1048" y="395" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Impact, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-style="italic" fill="#ffd23f">~1.5</text><text x="1048" y="430" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c9d4ff">rings per</text><text x="1048" y="452" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c9d4ff">stick turn</text><line x1="976" y1="490" x2="1120" y2="490" stroke="#8798d8" stroke-opacity="0.3"/><text x="1048" y="530" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-style="italic" fill="#8f9fe0">about 10 / s with Auto spin</text><circle cx="1048.0" cy="580" r="13" fill="none" stroke="#ffd23f" stroke-width="4.2"/><circle cx="1048.0" cy="580" r="13" fill="none" stroke="#fff6b0" stroke-width="1.5" stroke-dasharray="15.6 65.0" transform="rotate(-120 1048.0 580)"/><text x="1140" y="682" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8f9fe0">Approximate, at 60 fps. Riders Crosswake on, Ring Replenish on (Settings → Gameplay → Riders Crosswake features).</text></svg>
