<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Three steps to new textures"><title>Three steps to new textures</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F2430"/></marker></defs><rect width="900" height="330" rx="18" fill="#FBF8F1"/><g font-family="Verdana, sans-serif"><text x="28" y="30" font-size="14" fill="#7A4FC9" font-weight="bold">ILLUSTRATION · NOT A SCREENSHOT</text><text x="28" y="72" font-size="28" font-weight="bold" fill="#1F2430">Three steps to new textures</text><rect x="30" y="105" width="250" height="190" rx="14" fill="#fff" stroke="#2457A6" stroke-width="2"/><circle cx="155" cy="147" r="18" fill="#B4235A"/><text x="155" y="154" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="155" y="210" font-size="27" fill="#1F2430" text-anchor="middle" font-weight="bold">Download</text><text x="155" y="243" font-size="19" fill="#1F2430" text-anchor="middle">a texture pack</text><text x="155" y="271" font-size="17" fill="#556" text-anchor="middle">.zip  .7z  .rar</text><line x1="285" y1="200" x2="318" y2="200" stroke="#1F2430" stroke-width="4" marker-end="url(#a)"/><rect x="325" y="105" width="250" height="190" rx="14" fill="#fff" stroke="#2457A6" stroke-width="2"/><circle cx="450" cy="147" r="18" fill="#B4235A"/><text x="450" y="154" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="450" y="210" font-size="27" fill="#1F2430" text-anchor="middle" font-weight="bold">Add it</text><text x="450" y="243" font-size="19" fill="#1F2430" text-anchor="middle">to the game</text><text x="450" y="271" font-size="17" fill="#556" text-anchor="middle">one button, or copy a folder</text><line x1="580" y1="200" x2="613" y2="200" stroke="#1F2430" stroke-width="4" marker-end="url(#a)"/><rect x="620" y="105" width="250" height="190" rx="14" fill="#fff" stroke="#2457A6" stroke-width="2"/><circle cx="745" cy="147" r="18" fill="#B4235A"/><text x="745" y="154" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="745" y="210" font-size="27" fill="#1F2430" text-anchor="middle" font-weight="bold">Play</text><text x="745" y="243" font-size="19" fill="#1F2430" text-anchor="middle">and enjoy</text><text x="745" y="271" font-size="17" fill="#556" text-anchor="middle">the new look in the game</text></g></svg>
