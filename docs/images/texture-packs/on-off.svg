<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Turn packs on or off in the game"><title>Turn packs on or off in the game</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F2430"/></marker></defs><rect width="900" height="400" rx="18" fill="#FBF8F1"/><g font-family="Verdana, sans-serif"><text x="28" y="30" font-size="14" fill="#7A4FC9" font-weight="bold">ILLUSTRATION · NOT A SCREENSHOT</text><text x="28" y="72" font-size="28" font-weight="bold" fill="#1F2430">Turn packs on or off in the game</text><rect x="25" y="100" width="400" height="270" rx="14" fill="#E8F0FB" stroke="#2457A6" stroke-width="2"/><text x="47" y="135" font-size="21" fill="#2457A6" text-anchor="start" font-weight="bold">Open the settings menu</text><text x="47" y="180" font-size="19" fill="#1F2430" text-anchor="start">Switch: hold − (Minus)</text><text x="47" y="222" font-size="19" fill="#1F2430" text-anchor="start">PC: hold F1 (or Back)</text><text x="47" y="264" font-size="19" fill="#1F2430" text-anchor="start">Steam Deck: hold View</text><text x="47" y="306" font-size="19" fill="#1F2430" text-anchor="start">Phone: the top-left button</text><line x1="430" y1="235" x2="470" y2="235" stroke="#1F2430" stroke-width="4" marker-end="url(#a)"/><rect x="480" y="100" width="395" height="270" rx="14" fill="#151A2B" stroke="#151A2B" stroke-width="2"/><text x="505" y="140" font-size="22" fill="#C98A12" text-anchor="start" font-weight="bold">Mods</text><text x="505" y="190" font-size="20" fill="#E6E8F0" text-anchor="start">☑  My HD Pack</text><text x="505" y="235" font-size="20" fill="#8A90A6" text-anchor="start">☐  Another pack</text><text x="505" y="290" font-size="17" fill="#C9CDDA" text-anchor="start">Changes apply the next</text><text x="505" y="316" font-size="17" fill="#C9CDDA" text-anchor="start">time you start the game.</text></g></svg>
