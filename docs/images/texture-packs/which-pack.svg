<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Pick a pack made for Sonic Riders (USA)"><title>Pick a pack made for Sonic Riders (USA)</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F2430"/></marker></defs><rect width="900" height="470" rx="18" fill="#FBF8F1"/><g font-family="Verdana, sans-serif"><text x="28" y="30" font-size="14" fill="#7A4FC9" font-weight="bold">ILLUSTRATION · NOT A SCREENSHOT</text><text x="28" y="72" font-size="28" font-weight="bold" fill="#1F2430">Pick a pack made for Sonic Riders (USA)</text><rect x="25" y="100" width="850" height="215" rx="14" fill="#E6F5EC" stroke="#1E8A5A" stroke-width="2"/><text x="47" y="135" font-size="22" fill="#156B42" text-anchor="start" font-weight="bold">YES · the pack has a folder named GXEE8P</text><path d="M58 164 h16 l6 6 v22 h-22 z" fill="#fff" stroke="#556" stroke-width="1.5"/><text x="95" y="184" font-size="20" fill="#1F2430" text-anchor="start">My HD Pack.zip   (what you downloaded)</text><path d="M95 208 h12 l4 4 h14 v18 h-30 z" fill="#7BD3A0" stroke="#8A6A10" stroke-width="1.5"/><text x="135" y="226" font-size="22" fill="#156B42" text-anchor="start" font-weight="bold">GXEE8P</text><text x="250" y="226" font-size="20" fill="#156B42" text-anchor="start">← the game&#x27;s ID: this is the one</text><path d="M135 248 h12 l4 4 h14 v18 h-30 z" fill="#F2C94C" stroke="#8A6A10" stroke-width="1.5"/><text x="175" y="266" font-size="18" fill="#1F2430" text-anchor="start">Menus, HUD, ...   (any folders inside are fine)</text><path d="M98 284 h16 l6 6 v22 h-22 z" fill="#fff" stroke="#556" stroke-width="1.5"/><text x="135" y="304" font-size="18" fill="#1F2430" text-anchor="start">READ ME.txt</text><rect x="25" y="335" width="850" height="112" rx="14" fill="#FCE8F0" stroke="#B4235A" stroke-width="2"/><text x="47" y="370" font-size="22" fill="#B4235A" text-anchor="start" font-weight="bold">NO · a pack for another game or another disc</text><text x="47" y="404" font-size="19" fill="#1F2430" text-anchor="start">A different ID (for example GXEJ8P, the Japanese disc) won&#x27;t match.</text><text x="47" y="434" font-size="19" fill="#1F2430" text-anchor="start">Look for “Dolphin” and “GXEE8P” on the download page.</text></g></svg>
