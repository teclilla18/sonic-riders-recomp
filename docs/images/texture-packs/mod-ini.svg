<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="mod.ini: three lines are enough"><title>mod.ini: three lines are enough</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F2430"/></marker></defs><rect width="900" height="300" rx="18" fill="#FBF8F1"/><g font-family="Verdana, sans-serif"><text x="28" y="30" font-size="14" fill="#7A4FC9" font-weight="bold">ILLUSTRATION · NOT A SCREENSHOT</text><text x="28" y="72" font-size="28" font-weight="bold" fill="#1F2430">mod.ini: three lines are enough</text><rect x="40" y="100" width="520" height="170" rx="10" fill="#fff" stroke="#556" stroke-width="2"/><text x="60" y="145" font-size="24" fill="#1F2430" text-anchor="start" font-family="Consolas, Menlo, monospace">[mod]</text><text x="60" y="190" font-size="24" fill="#1F2430" text-anchor="start" font-family="Consolas, Menlo, monospace">name = My HD Pack</text><text x="60" y="235" font-size="24" fill="#1F2430" text-anchor="start" font-family="Consolas, Menlo, monospace">game = GXEE8P</text><text x="590" y="145" font-size="19" fill="#1F2430" text-anchor="start" font-weight="bold">Make it in Notepad</text><text x="590" y="178" font-size="19" fill="#1F2430" text-anchor="start">(or any text editor).</text><text x="590" y="225" font-size="19" fill="#1F2430" text-anchor="start">Save it as mod.ini,</text><text x="590" y="255" font-size="19" fill="#B4235A" text-anchor="start" font-weight="bold">not mod.ini.txt</text></g></svg>
