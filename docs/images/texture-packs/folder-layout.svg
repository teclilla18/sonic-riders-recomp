<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Copying a pack by hand: the folder layout"><title>Copying a pack by hand: the folder layout</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F2430"/></marker></defs><rect width="900" height="560" rx="18" fill="#FBF8F1"/><g font-family="Verdana, sans-serif"><text x="28" y="30" font-size="14" fill="#7A4FC9" font-weight="bold">ILLUSTRATION · NOT A SCREENSHOT</text><text x="28" y="72" font-size="28" font-weight="bold" fill="#1F2430">Copying a pack by hand: the folder layout</text><rect x="25" y="100" width="850" height="300" rx="14" fill="#E6F5EC" stroke="#1E8A5A" stroke-width="2"/><text x="47" y="135" font-size="22" fill="#156B42" text-anchor="start" font-weight="bold">YES · one folder per pack, inside mods</text><path d="M55 166 h12 l4 4 h14 v18 h-30 z" fill="#F2C94C" stroke="#8A6A10" stroke-width="1.5"/><text x="95" y="184" font-size="21" fill="#1F2430" text-anchor="start" font-weight="bold">mods</text><text x="200" y="184" font-size="18" fill="#156B42" text-anchor="start">← in the game&#x27;s folder (see your device below)</text><path d="M95 208 h12 l4 4 h14 v18 h-30 z" fill="#F2C94C" stroke="#8A6A10" stroke-width="1.5"/><text x="135" y="226" font-size="21" fill="#1F2430" text-anchor="start">My HD Pack</text><text x="330" y="226" font-size="18" fill="#156B42" text-anchor="start">← any name you like</text><path d="M138 248 h16 l6 6 v22 h-22 z" fill="#fff" stroke="#556" stroke-width="1.5"/><text x="175" y="268" font-size="21" fill="#1F2430" text-anchor="start" font-weight="bold">mod.ini</text><text x="330" y="268" font-size="18" fill="#156B42" text-anchor="start">← a small text file (next picture)</text><path d="M135 292 h12 l4 4 h14 v18 h-30 z" fill="#F2C94C" stroke="#8A6A10" stroke-width="1.5"/><text x="175" y="310" font-size="21" fill="#1F2430" text-anchor="start" font-weight="bold">textures</text><text x="330" y="310" font-size="18" fill="#156B42" text-anchor="start">← everything from the pack&#x27;s GXEE8P folder</text><path d="M178 332 h16 l6 6 v22 h-22 z" fill="#fff" stroke="#556" stroke-width="1.5"/><text x="215" y="352" font-size="18" fill="#1F2430" text-anchor="start">tex1_...dds   tex1_...png   (and their folders)</text><rect x="25" y="420" width="850" height="115" rx="14" fill="#FCE8F0" stroke="#B4235A" stroke-width="2"/><text x="47" y="455" font-size="22" fill="#B4235A" text-anchor="start" font-weight="bold">NO · these are skipped</text><text x="47" y="490" font-size="18" fill="#1F2430" text-anchor="start">Pictures loose in mods (no pack folder) · a pack folder without mod.ini</text><text x="47" y="520" font-size="18" fill="#1F2430" text-anchor="start">A pack folder inside another pack folder</text></g></svg>
