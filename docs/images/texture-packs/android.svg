<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Android: copy the pack from a PC with a USB cable"><title>Android: copy the pack from a PC with a USB cable</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F2430"/></marker></defs><rect width="900" height="520" rx="18" fill="#FBF8F1"/><g font-family="Verdana, sans-serif"><text x="28" y="30" font-size="14" fill="#7A4FC9" font-weight="bold">ILLUSTRATION · NOT A SCREENSHOT</text><text x="28" y="72" font-size="28" font-weight="bold" fill="#1F2430">Android: copy the pack from a PC with a USB cable</text><rect x="40" y="110" width="230" height="150" rx="10" fill="#fff" stroke="#1F2430" stroke-width="2"/><rect x="20" y="260" width="270" height="18" rx="6" fill="#ccd" stroke="#1F2430" stroke-width="2"/><text x="155" y="195" font-size="30" fill="#1F2430" text-anchor="middle" font-weight="bold">PC</text><line x1="290" y1="200" x2="398" y2="200" stroke="#1F2430" stroke-width="4" marker-end="url(#a)"/><text x="345" y="185" font-size="17" fill="#1F2430" text-anchor="middle" font-weight="bold">USB</text><rect x="410" y="100" width="120" height="220" rx="18" fill="#fff" stroke="#1F2430" stroke-width="2"/><text x="470" y="215" font-size="20" fill="#1F2430" text-anchor="middle" font-weight="bold">Phone</text><text x="560" y="140" font-size="19" fill="#1F2430" text-anchor="start">On the phone, pick</text><text x="560" y="172" font-size="20" fill="#2457A6" text-anchor="start" font-weight="bold">“File transfer”</text><text x="560" y="204" font-size="19" fill="#1F2430" text-anchor="start">when it asks what the</text><text x="560" y="234" font-size="19" fill="#1F2430" text-anchor="start">USB connection is for.</text><rect x="25" y="345" width="850" height="150" rx="14" fill="#E6F5EC" stroke="#1E8A5A" stroke-width="2"/><text x="47" y="380" font-size="20" fill="#156B42" text-anchor="start" font-weight="bold">On the PC open:</text><text x="47" y="416" font-size="19" fill="#1F2430" text-anchor="start">Phone  ›  Internal storage  ›  Android  ›  data  ›</text><text x="47" y="450" font-size="19" fill="#1F2430" text-anchor="start" font-weight="bold">net.srnative.sonicriders  ›  files  ›  mods</text><text x="47" y="481" font-size="17" fill="#1F2430" text-anchor="start">No mods folder? Make one (New folder › mods), then copy your pack folder in.</text></g></svg>
