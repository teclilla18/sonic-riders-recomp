<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-label="Finish → eject → put it back"><title>Finish → eject → put it back</title><rect width="900" height="490" rx="18" fill="#FBF8F1"/><g fill="#1F2430" font-family="Verdana, sans-serif"><text x="28" y="30" font-size="14" fill="#7A4FC9" font-weight="bold">ILLUSTRATION · NOT A SCREENSHOT</text><text x="28" y="77" font-size="30" font-weight="bold">Finish → eject → put it back</text><rect x="26" y="116" width="848" height="100" rx="14" fill="white" stroke="#E4DED0"/><circle cx="65" cy="165" r="22" fill="#2F6FD6"/><text x="65" y="173" text-anchor="middle" fill="white" font-size="24" font-weight="bold">1</text><text x="108" y="140" fill="#2F6FD6" font-size="16" font-weight="bold">1 · WAIT</text><text x="108" y="168" font-size="23" font-weight="bold">Copy finished?</text><text x="108" y="202" font-size="19" fill="#4A5160">Close files using the SD card</text><rect x="26" y="232" width="848" height="100" rx="14" fill="white" stroke="#E4DED0"/><circle cx="65" cy="281" r="22" fill="#7A4FC9"/><text x="65" y="289" text-anchor="middle" fill="white" font-size="24" font-weight="bold">2</text><text x="108" y="256" fill="#7A4FC9" font-size="16" font-weight="bold">2 · EJECT</text><text x="108" y="284" font-size="23" font-weight="bold">Eject SD card / Windows Eject</text><text x="108" y="318" font-size="19" fill="#4A5160">Wait for Safe to remove</text><rect x="26" y="348" width="848" height="100" rx="14" fill="white" stroke="#E4DED0"/><circle cx="65" cy="397" r="22" fill="#1E8A5A"/><text x="65" y="405" text-anchor="middle" fill="white" font-size="24" font-weight="bold">3</text><text x="108" y="372" fill="#1E8A5A" font-size="16" font-weight="bold">3 · REINSERT</text><text x="108" y="400" font-size="23" font-weight="bold">Console fully powered off</text><text x="108" y="434" font-size="19" fill="#4A5160">Put the card back, then boot</text></g></svg>