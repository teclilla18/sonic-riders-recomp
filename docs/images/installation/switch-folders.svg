<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-label="Right place. Right files."><title>Right place. Right files.</title><rect width="900" height="490" rx="18" fill="#FBF8F1"/><g fill="#1F2430" font-family="Verdana, sans-serif"><text x="28" y="30" font-size="14" fill="#7A4FC9" font-weight="bold">ILLUSTRATION · NOT A SCREENSHOT</text><text x="28" y="77" font-size="30" font-weight="bold">Right place. Right files.</text><rect x="25" y="105" width="850" height="240" rx="16" fill="#E6F5EC" stroke="#1E8A5A"/><text x="47" y="139" font-size="23" fill="#156B42" font-weight="bold">YES · files together in this game folder</text><text x="47" y="181" font-size="23" fill="#1F2430">SD card → switch → sonicriders</text><text x="47" y="223" font-size="22" fill="#1F2430">sonicriders.nro</text><text x="47" y="265" font-size="22" fill="#1F2430">Your full ISO / GCM beside the NRO</text><text x="47" y="307" font-size="22" fill="#1F2430">SonicRiders.iso  (example name)</text><rect x="25" y="367" width="850" height="98" rx="16" fill="#FCE8F0" stroke="#B4235A"/><text x="47" y="400" font-size="23" fill="#B4235A" font-weight="bold">NO · one switch folder too many</text><text x="47" y="442" font-size="21">SD → switch → switch → sonicriders</text></g></svg>