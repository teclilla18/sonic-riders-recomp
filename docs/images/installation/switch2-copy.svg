<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-label="Two windows. One destination."><title>Two windows. One destination.</title><rect width="900" height="490" rx="18" fill="#FBF8F1"/><g fill="#1F2430" font-family="Verdana, sans-serif"><text x="28" y="30" font-size="14" fill="#7A4FC9" font-weight="bold">ILLUSTRATION · NOT A SCREENSHOT</text><text x="28" y="77" font-size="30" font-weight="bold">Two windows. One destination.</text><rect x="26" y="116" width="848" height="100" rx="14" fill="white" stroke="#E4DED0"/><circle cx="65" cy="165" r="22" fill="#2F6FD6"/><text x="65" y="173" text-anchor="middle" fill="white" font-size="24" font-weight="bold">1</text><text x="108" y="140" fill="#2F6FD6" font-size="16" font-weight="bold">ON YOUR COMPUTER</text><text x="108" y="168" font-size="23" font-weight="bold">Open Output Folder</text><text x="108" y="202" font-size="19" fill="#4A5160">build / switch2/sd/switch/sonicriders-switch2</text><rect x="26" y="232" width="848" height="100" rx="14" fill="white" stroke="#E4DED0"/><circle cx="65" cy="281" r="22" fill="#7A4FC9"/><text x="65" y="289" text-anchor="middle" fill="white" font-size="24" font-weight="bold">2</text><text x="108" y="256" fill="#7A4FC9" font-size="16" font-weight="bold">COPY → PASTE</text><text x="108" y="284" font-size="23" font-weight="bold">sonicriders-switch2.nro</text><text x="108" y="318" font-size="19" fill="#4A5160">Plus your full ISO / GCM</text><rect x="26" y="348" width="848" height="100" rx="14" fill="white" stroke="#E4DED0"/><circle cx="65" cy="397" r="22" fill="#1E8A5A"/><text x="65" y="405" text-anchor="middle" fill="white" font-size="24" font-weight="bold">3</text><text x="108" y="372" fill="#1E8A5A" font-size="16" font-weight="bold">ON YOUR SD CARD</text><text x="108" y="400" font-size="23" font-weight="bold">switch / sonicriders-switch2</text><text x="108" y="434" font-size="19" fill="#4A5160">Put the files together here</text></g></svg>